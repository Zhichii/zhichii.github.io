# 站点配置 —— Hugo 0.169
# 本地预览：./bin/hugo server -D
# 构建产物：./bin/hugo --gc --minify

baseURL = "https://zhichii.github.io/"
title = "山邱HillQiu"
locale = "zh-CN"
defaultContentLanguage = "zh-hans"
hasCJKLanguage = true
enableRobotsTXT = true
summaryLength = 80

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"

[params]
  author = "山邱HillQiu"
  description = "山邱HillQiu 的个人网站：日志、想法，以及一些自己做的东西。"
  # 首页一句话介绍
  tagline = "一个中学生的自留地：写代码、做启动器、偶尔写点东西。"
  since = 2011
  # 站点左上角的图标 + 浏览器标签图标
  logo = "favicon.png"

  # giscus 评论（https://giscus.app）
  [params.giscus]
    repo = "Zhichii/zhichii.github.io"
    repoId = "R_kgDOHXx1Mg"
    category = "General"
    categoryId = "DIC_kwDOHXx1Ms4C4YDq"
    # specific：用 slug 当 term，跟语言、URL 结构、尾斜杠都无关
    #   /blog/hello-hugo/ 和 /en/blog/hello-hugo/ 共用同一个讨论串
    # 某篇文章要固定成别的 term（比如继承旧站的编号），在 front matter 里写 giscusTerm = "3"
    # 想按路径对应就把它改成 "pathname"（多语言下会分成两个讨论串）
    mapping = "specific"
    strict = "0"
    reactionsEnabled = "0"
    emitMetadata = "0"
    inputPosition = "top"
    loading = "lazy"
    lang = "zh-CN"
    themeLight = "light"
    themeDark = "dark"

[markup]
  [markup.goldmark.renderer]
    # 允许在 Markdown 里直接写 HTML（视频嵌入、<figure> 之类）
    unsafe = true
  [markup.goldmark.parser]
    attribute = { block = true, title = true }
  [markup.highlight]
    style = "catppuccin-mocha"
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[[menus.main]]
  name = "日志"
  pageRef = "/blog"
  weight = 10

[[menus.main]]
  name = "关于"
  pageRef = "/about"
  weight = 20

[[menus.main]]
  name = "标签"
  pageRef = "/tags"
  weight = 30

# 忘记写 date 时，回退到文件修改时间，免得日期变成 0001 年
[frontmatter]
  date = [":default", ":fileModTime"]
