<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-mark">山</span>
      <span class="brand-name">{{ site.Title }}</span>
    </a>

    <nav class="nav" aria-label="主导航">
      {{ range site.Menus.main -}}
      <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end -}}
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换主题">
        <span class="theme-label">自动</span>
      </button>
    </nav>
  </div>
</header>
