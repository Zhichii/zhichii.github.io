<!doctype html>
<html lang="{{ site.Language.Locale | default "zh-CN" }}">
{{ partial "head.html" . }}
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  {{ partial "header.html" . }}

  <main id="main" class="wrap">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
  <script>
    (() => {
      const root = document.documentElement;
      const btn = document.getElementById('theme-toggle');
      if (!btn) return;
      const label = btn.querySelector('.theme-label');

      const resolved = (mode) =>
        mode === 'light' || mode === 'dark'
          ? mode
          : matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';

      const paint = (mode) => {
        if (mode === 'light' || mode === 'dark') {
          root.dataset.theme = mode;
        } else {
          delete root.dataset.theme;
        }
        label.textContent = mode === 'dark' ? '亮' : mode === 'light' ? '暗' : '自动';
        btn.setAttribute('aria-label', '切换到' + (resolved(mode) === 'dark' ? '亮色' : '暗色'));
      };

      paint(localStorage.getItem('theme'));

      btn.addEventListener('click', () => {
        const next = resolved(root.dataset.theme) === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('theme', next); } catch (e) {}
        paint(next);
        document.dispatchEvent(new CustomEvent('themechange', { detail: next }));
      });
    })();
  </script>
</body>
</html>
